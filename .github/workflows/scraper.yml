name: Run LiveTV Scraper

on:
  schedule:
    # Runs automatically every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger button

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then npm install; fi

      - name: Create public directory
        run: mkdir -p public

      - name: Run Fetch Schedule
        run: node fetchSchedule.js

      - name: Commit and Push Updated Schedule
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/schedule.js
          git commit -m "Auto-update schedule" || exit 0
          git push
